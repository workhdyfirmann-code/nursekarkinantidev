services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nursekar}
      POSTGRES_USER: ${POSTGRES_USER:-nursekar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-this-password}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - local_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  libretranslate:
    image: libretranslate/libretranslate:latest
    command: ["--load-only", "en,id"]
    ports:
      - "${LIBRETRANSLATE_PORT:-5000}:5000"
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://nursekar:change-this-password@db:5432/nursekar?schema=public}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-this-password}
      SESSION_SECRET: ${SESSION_SECRET:-replace-with-a-long-random-secret}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    depends_on:
      db:
        condition: service_healthy
      libretranslate:
        condition: service_started
    ports:
      - "${APP_PORT:-3000}:3000"
    volumes:
      - ./public/uploads:/app/public/uploads
    restart: unless-stopped

volumes:
  local_postgres_data:
    name: nursekar_local_postgres_data
